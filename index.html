<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tony</title>
<style>
:root{--bg:#f3f4f7;--card:#fff;--tx:#12151c;--mut:#6b7280;--ac:#16a34a;--ac2:#0ea5e9;--bub:#e9ebf0;--bd:#e2e5ea;--dng:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1015;--card:#171b22;--tx:#eef0f4;--mut:#99a1ad;--bub:#232933;--bd:#2a303a;--ac:#22c55e}}
:root[data-theme="dark"]{--bg:#0d1015;--card:#171b22;--tx:#eef0f4;--mut:#99a1ad;--bub:#232933;--bd:#2a303a;--ac:#22c55e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;max-width:600px;margin:0 auto;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
.top h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{position:relative;width:40px;height:40px;border-radius:12px;border:0;background:var(--bub);display:grid;place-items:center;font-size:26px;line-height:1}
#bl{font-size:20px}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--dng);color:#fff;font:700 11px/1 system-ui,sans-serif;font-style:normal;display:none;place-items:center;padding:0 4px}
.ic span,.ic span:before,.ic span:after{display:block;width:18px;height:2px;background:var(--tx);border-radius:2px;position:relative;content:""}
.ic span:before{position:absolute;top:-6px}.ic span:after{position:absolute;top:6px}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.vw{display:none;flex:1;min-height:0;overflow-y:auto;padding:14px 16px 90px}
#v-chat{padding:0;overflow:hidden;flex-direction:column}
.tab{display:flex;background:var(--card);border-top:1px solid var(--bd)}
.tab button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px}
.tab button span{font-size:20px}.tab .on{color:var(--ac);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.25s;z-index:20}
.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:300px;background:var(--card);z-index:30;transform:translateX(-102%);transition:transform .25s;padding:calc(env(safe-area-inset-top,0px) + 20px) 14px 20px;display:flex;flex-direction:column;gap:6px}
.dr.on{transform:none}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;margin-bottom:14px}
.brand i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-style:normal;font-size:20px}
.nav{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;background:none;border-radius:12px;text-align:left;font-weight:600;width:100%}
.nav.on{background:var(--bub)}
.sep{height:1px;background:var(--bd);margin:8px 0}
.st{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:18px;padding:14px}
.st.b{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.st small{opacity:.85;display:block;font-size:12px}.st b{font-size:20px}
.big{padding:18px;margin-bottom:12px}.big>b{font-size:32px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.two b{font-size:17px}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.sum3 .st{padding:11px}.sum3 b{font-size:15px}
.cmp{font-size:11px;margin-top:2px;display:block}
h3{margin:18px 0 8px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
h3 button{border:0;background:none;color:var(--ac);font-weight:700;text-transform:none;letter-spacing:0;font-size:15px}
.g{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.g[data-a]{cursor:pointer}
.g .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.g .h b{font-size:17px}
.pc{font-weight:800;font-size:22px;color:var(--ac)}
.bar{height:10px;background:var(--bub);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:6px;transition:width .4s}
.sub{color:var(--mut);font-size:14px}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;border:1px solid var(--bd);background:var(--bub);border-radius:12px;padding:10px;font-weight:600;font-size:14px}
.acts .p{background:var(--ac);color:#fff;border:0}
.acts .x{flex:none;color:var(--dng);padding:10px 14px}
.ac{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:11px 14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.ac button{border:0;background:none;color:var(--mut);font-size:14px;margin-left:8px}
.ac small{color:var(--mut);font-size:12px}
.emp{text-align:center;color:var(--mut);padding:22px 10px}
.fc{margin-top:10px;background:var(--bub);border-radius:12px;padding:10px 12px;font-size:14px}
.fc span{color:var(--mut);font-size:12.5px}.fc.ok{color:var(--ac);font-weight:700}
.tip,.rem{border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.tip{background:linear-gradient(135deg,rgba(34,197,94,.14),rgba(14,165,233,.14))}
.rem{background:rgba(245,158,11,.14);display:flex;justify-content:space-between;gap:8px}
.rem button{border:0;background:none;color:var(--mut)}
.dn{width:130px;height:130px;border-radius:50%;margin:6px auto 12px;position:relative}
.dn:after{content:"";position:absolute;inset:28px;background:var(--bg);border-radius:50%}
.lg{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:4px 2px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.yr{display:flex;justify-content:center;align-items:center;gap:18px;margin-bottom:12px;font-size:19px}
.yr button{border:0;background:var(--bub);width:38px;height:38px;border-radius:12px;font-size:20px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 8px}
.chips button{flex:none;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px}
.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#ais{font-size:12px;color:var(--mut);padding:8px 16px 0;text-align:center}
#chat{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.m{max-width:85%;padding:9px 13px;border-radius:18px 18px 18px 4px;background:var(--card);border:1px solid var(--bd);white-space:pre-wrap;animation:up .2s}
.m:not(.me){position:relative;margin-left:32px}
.m:not(.me):before{content:"🎯";position:absolute;left:-32px;bottom:0;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-size:13px}
.m.me{align-self:flex-end;background:var(--ac);color:#fff;border:0;border-radius:18px 18px 4px 18px}
.dots i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--mut);animation:bn 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bn{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.in{display:flex;gap:8px;padding:6px 16px 12px}
.in input{flex:1;min-width:0;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:12px 16px;font-size:16px}
.send{border:0;background:var(--ac);color:#fff;border-radius:999px;padding:0 20px;font-weight:700}
.mic{border:0;background:var(--bub);border-radius:999px;width:46px;flex:none;font-size:20px;display:none}
.mic.on{background:var(--dng);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.55}}
.fab{position:fixed;right:max(16px,calc(50% - 284px));bottom:calc(env(safe-area-inset-bottom,0px) + 78px);border:0;background:var(--ac);color:#fff;border-radius:999px;padding:14px 22px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:10;display:none}
.md{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
.md.on{display:flex}
.sh{background:var(--card);width:100%;max-width:600px;max-height:90%;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 20px)}
.sh h2{margin:0 0 12px;font-size:19px}.sh p{margin:0 0 6px}
.sh label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.sh input{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:12px;font-size:16px}
.sh .r{display:flex;gap:10px;margin-top:16px}
.sh .r button{flex:1;padding:13px;border-radius:12px;border:0;font-weight:700;background:var(--bub)}
.sh .r .ok{background:var(--ac);color:#fff}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="top"><button class="ic" id="mb" aria-label="Menu"><span></span></button><h1 id="ttl">Tony</h1><button class="ic" id="bl" aria-label="Notificações">🔔<i class="badge" id="bg"></i></button></div>
<main id="main">
 <section class="vw" id="v-home"></section>
 <section class="vw" id="v-goals"></section>
 <section class="vw" id="v-goal"></section>
 <section class="vw" id="v-chat"><div id="ais"></div><div id="chat"></div><div class="chips" id="chips"></div><div class="in"><input id="t" placeholder="Fala com o Tony…" autocomplete="off"><button class="mic" id="mic" aria-label="Falar com o Tony">🎤</button><button class="send" id="s">Enviar</button></div></section>
 <section class="vw" id="v-sum"></section>
 <section class="vw" id="v-hist"></section>
 <section class="vw" id="v-acc"></section>
 <section class="vw" id="v-ach"></section>
 <section class="vw" id="v-nt"></section>
</main>
<nav class="tab">
 <button data-t="home"><span>🏠</span>Início</button>
 <button data-t="goals"><span>🎯</span>Metas</button>
 <button data-t="chat"><span>💬</span>Chat</button>
 <button data-t="sum"><span>📊</span>Resumo</button>
</nav>
<button class="fab" id="fab" data-a="ng">+ Nova meta</button>
<div class="ov" id="ov"></div>
<aside class="dr" id="dr">
 <div class="brand"><i>🎯</i>Tony</div>
 <button class="nav" data-m="acc">🏦 Contas</button>
 <button class="nav" data-m="hist">🧾 Histórico</button>
 <button class="nav" data-m="ach">🏆 Conquistas</button>
 <button class="nav" data-m="nt">🔔 Avisos</button>
 <div class="sep"></div>
 <button class="nav" id="ib">📲 Baixar / instalar o app</button>
 <button class="nav" id="bk">💾 Backup e dados</button>
</aside>
<div class="md" id="md"><div class="sh" id="sh"></div></div>
<div id="toast"></div>
<script>
var KEY="tony-v2",S={v:0,accounts:[],goals:[],mv:[],msgs:[],plan:{inc:0,fixed:[],free:0},view:"home",gid:null,pending:null,last:null,hf:"all",hm:null,hy:null,rem:"",nt:[],nk:{},nset:{free:400,sys:0}};
try{var r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var brl=function(n){return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})};
var uid=function(){return Math.random().toString(36).slice(2,8)};
var f1=function(n){return n.toFixed(1).replace(".",",")};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var NW={cem:100,cento:100,vinte:20,"vintão":20,trinta:30,quarenta:40,cinquenta:50,cinquentinha:50,"cinquentão":50,sessenta:60,setenta:70,oitenta:80,noventa:90,duzentos:200,trezentos:300,quatrocentos:400,quinhentos:500,mil:1000};
function num(s){s=String(s).toLowerCase();var m=s.match(/\d[\d.]*(?:,\d+)?/);
  if(m){var v=parseFloat(m[0].replace(/\./g,"").replace(",","."));if(isNaN(v))return null;
    var mm=s.slice(m.index+m[0].length).match(/^\s*(?:mil|k)(?![a-zà-ú])(?:\s*e\s*(\d+))?/);if(mm){v*=1000;if(mm[1])v+=+mm[1]}return v}
  for(var w in NW){if(new RegExp("(^|[^a-zà-ú])"+w+"(?![a-zà-ú])").test(s))return NW[w]}
  return null}
function nm(s){return String(s||"").toLowerCase()}
function fdt(d){return d.toLocaleDateString("pt-BR",{day:"numeric",month:"short",year:"numeric"})}
function pd(s){var m=String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(!m)return 0;var y=+m[3];if(y<100)y+=2000;var d=new Date(y,+m[2]-1,+m[1]);return isNaN(d.getTime())?0:d.getTime()}

/* ---------- migração ---------- */
function migrate(){
  S.plan=S.plan||{};S.plan.inc=S.plan.inc||0;S.plan.fixed=S.plan.fixed||[];S.plan.free=S.plan.free||0;
  S.accounts=S.accounts||[];S.mv=S.mv||[];S.goals=S.goals||[];
  S.nt=S.nt||[];S.nk=S.nk||{};S.nset=S.nset||{};if(S.nset.free==null)S.nset.free=400;
  S.goals.forEach(function(g){g.img=g.img||"🎯";g.due=g.due||0;g.created=g.created||Date.now();if(g.mon==null)g.mon=(S.plan.alloc&&S.plan.alloc[g.id])||0;delete g.log});
  if(!S.v||S.v<3){
    var wb=0,df=null;(S.tx||[]).forEach(function(x){if(x.w)wb+=x.k=="in"?x.v:-x.v});
    if(wb>0||!S.accounts.length){df={id:uid(),name:"Carteira",bal:Math.max(0,wb)};S.accounts.push(df)}
    (S.tx||[]).forEach(function(x){var g=S.goals.find(function(g){return g.name==x.n});var m={id:x.id||uid(),t:x.t,v:x.v,n:x.n||"",c:x.c||""};
      if(x.k=="in")m.k="in";else if(x.k=="out"&&!g)m.k="out";else if(x.k=="out")m.k="wd";else m.k="dep";
      if(g&&m.k!="in"&&m.k!="out")m.g=g.id;if(x.w&&df)m.a=df.id;S.mv.push(m)});
    delete S.tx;delete S.plan.exp;delete S.plan.alloc;S.v=3;
  }
}
migrate();

/* ---------- modelo financeiro ---------- */
function acc(id){return S.accounts.find(function(a){return a.id==id})}
function gl(id){return S.goals.find(function(g){return g.id==id})}
function pc(g){return Math.max(0,Math.min(100,g.saved/g.price*100))}
function tot(){var r=0,f=0;S.goals.forEach(function(g){r+=g.saved});S.accounts.forEach(function(a){f+=a.bal});return{r:r,f:f,t:r+f}}
function defAcc(){if(!S.accounts.length)S.accounts.push({id:uid(),name:"Carteira",bal:0});return S.accounts[0]}
function byName(list,t){t=nm(t);if(!t)return null;return list.find(function(x){return nm(x.name)==t})||list.find(function(x){var a=nm(x.name);return t.indexOf(a)>-1||a.indexOf(t)>-1})||list.find(function(x){return nm(x.name).split(/\s+/).some(function(w){return w.length>2&&t.indexOf(w)>-1})})}
function names(l){return l.map(function(x){return x.name}).join(" ou ")}
function ap(m,s){var a=acc(m.a),b=acc(m.b),g=gl(m.g),h=gl(m.h),v=s*m.v;
  if(m.k=="in"){if(a)a.bal+=v}else if(m.k=="out"){if(a)a.bal-=v}
  else if(m.k=="dep"){if(a)a.bal-=v;if(g)g.saved+=v}
  else if(m.k=="wd"){if(a)a.bal+=v;if(g)g.saved-=v}
  else if(m.k=="tr"){if(a)a.bal-=v;if(b)b.bal+=v}
  else if(m.k=="gg"){if(g)g.saved-=v;if(h)h.saved+=v}}
function chk(m){var a=acc(m.a),g=gl(m.g);
  if(["out","dep","tr"].indexOf(m.k)>-1&&a&&a.bal<m.v-0.005)return "Saldo insuficiente em "+a.name+" ("+brl(a.bal)+"). Registre uma entrada primeiro.";
  if((m.k=="wd"||m.k=="gg")&&g&&g.saved<m.v-0.005)return "A meta “"+g.name+"” só tem "+brl(g.saved)+" guardado.";
  if(m.k=="tr"&&m.a==m.b)return "Escolha duas contas diferentes.";
  return ""}
function add(m){var e=chk(m);if(e)return e;var g=gl(m.g),h=gl(m.h),b1=g?pc(g):0,b2=h?pc(h):0;
  m.id=uid();m.t=m.t||Date.now();ap(m,1);S.mv.push(m);
  [[g,b1],[h,b2]].forEach(function(p){if(p[0]){var a=pc(p[0]);[25,50,75,100].forEach(function(t){if(p[1]<t&&a>=t)toast("🎉 “"+p[0].name+"” chegou a "+t+"%!")})}});
  if(g||h)S.last=(g||h).id;save();return ""}
function undo(id){var m=S.mv.find(function(x){return x.id==id});if(!m)return "Não achei essa movimentação.";
  var im={k:{in:"out",out:"in",dep:"wd",wd:"dep",tr:"tr",gg:"gg"}[m.k],v:m.v,a:m.a,b:m.b,g:m.g,h:m.h};
  if(m.k=="tr"||m.k=="gg"){im.a=m.b;im.b=m.a;im.g=m.h;im.h=m.g}
  var e=chk(im);if(e)return "Não dá pra desfazer: "+e;ap(m,-1);S.mv=S.mv.filter(function(x){return x.id!=id});save();return ""}
function prep(m){
  if(["in","out","dep","wd"].indexOf(m.k)>-1&&!m.a&&!m.init){
    var A=null;if(S.accounts.length<2)A=defAcc();
    else if(m.k=="out"||m.k=="dep"){var c=S.accounts.filter(function(a){return a.bal>=m.v-0.005});if(c.length==1)A=c[0]}
    if(!A)return{ask:"a"};m.a=A.id}
  if((m.k=="dep"||m.k=="wd")&&!m.g){if(S.goals.length==1)m.g=S.goals[0].id;else return S.goals.length?{ask:"g"}:{err:"Você ainda não tem metas. Cria uma na aba Metas 🎯"}}
  return{}}
function mstats(y,mo){var T={in:0,out:0,dep:0},C={};S.mv.forEach(function(x){var d=new Date(x.t);if(d.getFullYear()!=y||d.getMonth()!=mo)return;
  if(x.k=="in")T.in+=x.v;else if(x.k=="out"){T.out+=x.v;var c=x.c||"Outros";C[c]=(C[c]||0)+x.v}else if(x.k=="dep")T.dep+=x.v;else if(x.k=="wd")T.dep-=x.v});return{T:T,C:C}}

  if(hn&&/quanto (eu )?gast|onde (eu )?gast|gastos|pra onde (foi|vai)/.test(t)){var d=new Date(),M=mstats(d.getFullYear(),d.getMonth()),ks=Object.keys(M.C).sort(function(a,b){return M.C[b]-M.C[a]});
    say(ks.length?"Esse mês você gastou "+brl(M.T.out)+". O que mais pesou: "+ks.slice(0,3).map(function(k){return k+" ("+brl(M.C[k])+")"}).join(", ")+".":"Você ainda não gastou nada esse mês no que eu registrei 👀");return}
  if(!hn&&/posso|d[aá] pra|consigo|vale a pena/.test(t)&&/compr|gastar|pagar|pedir/.test(t)&&/\?|posso|d[aá] pra|consigo/.test(t)){var vv=num(t),T=tot(),fr=T.f-vv;
    say(fr>=0?"Dá sim! Você tem "+brl(T.f)+" livre e ficaria com "+brl(fr)+". Se comprar, me fala “gastei "+vv+"” que eu anoto.":"Hoje não dá: você tem "+brl(T.f)+" livre e faltariam "+brl(-fr)+". Dá pra tirar de uma meta, mas aí ela atrasa.");return}
  var parts=raw.replace(/(\d),(\d)/g,"$1§$2").split(/\s*(?:,|;|\.\s|\se\s(?=(?:mais\s)?(?:gast|ganh|receb|pag|compr|coloc|mand|pass|guard|bot|tir|retir)))\s*/i).map(function(p){return p.replace(/§/g,",")}).filter(function(p){return num(p)!==null});
  if(parts.length>1){var last="";parts.forEach(function(p){var m=p.match(/(gast\w*|ganh\w*|receb\w*|pag\w*|compr\w*|coloc\w*|mand\w*|pass\w*|guard\w*|bot\w*|tir\w*|retir\w*)/i);if(m)last=m[1];else if(last)p=last+" "+p;one(p)});return}
  one(raw)}
function aiStat(){var e=$("ais");if(!e)return;e.textContent=NOAI?"⚪ Modo simples: a IA não liberou aqui. Toque em “Tentar IA de novo”.":AIERR?"🟡 A IA falhou ("+AIERR+"), usei o modo simples.":"🟢 Tony com IA"}
function aiInit(){aiStat();try{claude.use("sample").then(function(x){if(!x)NOAI=true;aiStat();if(S.view=="chat")render()}).catch(function(){NOAI=true;aiStat()})}catch(e){NOAI=true;aiStat()}}
function tl(m){var p=prep(m);if(p.ask)return p.ask=="a"?"Ambíguo: pergunte ao usuário em qual conta ("+names(S.accounts)+")":"Ambíguo: pergunte qual meta ("+names(S.goals)+")";if(p.err)return p.err;var e=add(m);return e||("Feito. "+bal())}
function dt(i){var n=+i.days_ago;return n>0&&n<400?Date.now()-n*864e5:undefined}
function tools(){var n={type:"number"},s={type:"string"},A=function(i){var a=byName(S.accounts,i.account);return a?a.id:undefined},Gd=function(i){var g=byName(S.goals,i.goal);return g?g.id:undefined};
  return [
   {name:"add_income",description:"Registra dinheiro que entrou numa conta (ganhou, recebeu, caiu pix, mesada, bico, salário). days_ago = quantos dias atrás aconteceu (ontem=1).",inputSchema:{type:"object",properties:{amount:n,account:s,note:s,days_ago:n},required:["amount"]},execute:function(i){return tl({k:"in",v:Math.abs(+i.amount),a:A(i),n:i.note,t:dt(i)})}},
   {name:"add_expense",description:"Registra um gasto que saiu de uma conta (gastei, paguei, torrei, pedi, comprei, mandei pix). Sempre informe a categoria: Alimentação, Transporte, Jogos, Lazer, Compras, Contas, Saúde ou Outros. days_ago = quantos dias atrás (ontem=1).",inputSchema:{type:"object",properties:{amount:n,category:s,account:s,note:s,days_ago:n},required:["amount","category"]},execute:function(i){return tl({k:"out",v:Math.abs(+i.amount),a:A(i),c:i.category||cat(i.note),n:i.note,t:dt(i)})}},
   {name:"deposit_to_goal",description:"Guarda dinheiro de uma conta numa meta (guarda, separa, poupa, bota no cofrinho). O total de dinheiro não muda.",inputSchema:{type:"object",properties:{goal:s,amount:n,account:s},required:["amount"]},execute:function(i){return tl({k:"dep",v:Math.abs(+i.amount),g:Gd(i),a:A(i)})}},
   {name:"withdraw_from_goal",description:"Tira dinheiro de uma meta e devolve pra uma conta (tirei, saquei, usei da meta).",inputSchema:{type:"object",properties:{goal:s,amount:n,account:s},required:["amount"]},execute:function(i){return tl({k:"wd",v:Math.abs(+i.amount),g:Gd(i),a:A(i)})}},
   {name:"transfer",description:"Transfere dinheiro entre duas contas.",inputSchema:{type:"object",properties:{from:s,to:s,amount:n},required:["from","to","amount"]},execute:function(i){var a=byName(S.accounts,i.from),b=byName(S.accounts,i.to);if(!a||!b)return "Conta não encontrada: "+names(S.accounts);return tl({k:"tr",v:Math.abs(+i.amount),a:a.id,b:b.id})}},
   {name:"undo_last",description:"Desfaz a última movimentação registrada.",inputSchema:{type:"object",properties:{}},execute:function(){var l=S.mv[S.mv.length-1];if(!l)return "Nada pra desfazer.";return undo(l.id)||"Desfeito."}},
   {name:"create_goal",description:"Cria uma meta nova.",inputSchema:{type:"object",properties:{name:s,price:n,emoji:s},required:["name","price"]},execute:function(i){if(!(+i.price>0))return "Preço inválido.";var g={id:uid(),name:String(i.name),price:+i.price,saved:0,img:i.emoji||"🎯",due:0,mon:0,created:Date.now()};S.goals.push(g);save();return "Meta criada: "+gs(g)}},
   {name:"get_status",description:"Consulta saldo, metas e gastos do mês SEM registrar nada. Use pra perguntas como 'quanto tenho', 'dá pra comprar X', 'quanto falta'.",inputSchema:{type:"object",properties:{}},execute:function(){var d=new Date(),M=mstats(d.getFullYear(),d.getMonth());return bal()+" Metas: "+(S.goals.map(gs).join(" | ")||"nenhuma")+" Mês: entrou "+brl(M.T.in)+", gastou "+brl(M.T.out)+" ("+Object.keys(M.C).map(function(k){return k+" "+brl(M.C[k])}).join(", ")+"), foi pra metas "+brl(M.T.dep)+"."}}
  ]}
async function ai(x){
  var sm=null;try{sm=await claude.use("sample")}catch(e){}
  if(!sm){NOAI=true;aiStat();return false}
  var el=document.createElement("div");el.className="m";el.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';chat.appendChild(el);chat.scrollTop=chat.scrollHeight;
  var d=new Date(),M=mstats(d.getFullYear(),d.getMonth()),hs=S.msgs.slice(-13,-1).map(function(m){return (m.me?"Usuário: ":"Tony: ")+m.t}).join("\n"),
  KN={in:"entrada",out:"gasto",dep:"guardou em meta",wd:"retirou de meta",tr:"transferência",gg:"entre metas"},
  rm=S.mv.slice(-6).map(function(m){return KN[m.k]+" R$ "+m.v+(m.n?" ("+m.n+")":"")+(m.c?" ["+m.c+"]":"")}).join("; ")||"nenhuma";
  var p="Você é o Tony, parceiro de economia pessoal dentro de um app. Fale em português do Brasil, informal, simpático e curto (no máximo 3 frases). Valores em reais.\nModelo do app: o dinheiro está em CONTAS (livre pra gastar) ou RESERVADO em METAS. Guardar numa meta tira da conta e vai pra meta, então o total nunca muda. Entradas e gastos mexem numa conta. Registre SEMPRE com as ferramentas antes de responder e depois comente o resultado (saldo livre, % da meta). Gastos sempre com categoria (Alimentação, Transporte, Jogos, Lazer, Compras, Contas, Saúde ou Outros). Se houver mais de uma conta ou meta e não ficar claro qual, pergunte antes de registrar. Se a ferramenta devolver erro de saldo, explique de forma simples. Pode sugerir guardar parte da sobra, mas sem obrigar. Se o usuário pedir pra desfazer ou corrigir, use undo_last.\n\nENTENDER O JEITO QUE O USUÁRIO FALA (gírias, abreviações, erros de digitação, áudio transcrito):\n- Dinheiro: pila, conto, mango, real, pau = reais; cinquentinha=50; 'mil', '1k', '2 mil e 500' = 1000, 1000, 2500; 'meia' = metade.\n- Gasto: gastei, torrei, queimei, paguei, pedi um ifood, dei um rolê, rachei, comprei, mandei um pix, perdi, assinei.\n- Entrada: recebi, caiu um pix, me pagaram, mesada, bico, freela, salário, vendi, ganhei, rendeu.\n- Guardar: guarda, separa, bota, joga, poupa, manda pro cofrinho/meta. Retirar: tirei, saquei, usei da meta.\n- Situação: 'tô quebrado/duro/liso' = pouco dinheiro (responda com o saldo, sem registrar); 'tô bem de grana' idem.\n- Tempo: 'ontem'=days_ago 1, 'anteontem'=2, 'semana passada'=7, 'há 3 dias'=3. Sem tempo = hoje.\n- Várias coisas numa frase ('gastei 20 no lanche e 15 no uber, recebi 100'): registre CADA uma com uma ferramenta.\n- Use o CONTEXTO: 'e mais 10' repete o tipo da última movimentação; 'foi no Nubank' define a conta; 'isso' ou 'esse último' fala da última movimentação; 'sim', 'pode', 'bora' aceita a sugestão que você acabou de fazer, então execute.\n- Perguntas como 'dá pra comprar X de 80?', 'quanto tenho?', 'quanto falta pro Xbox?', 'quanto gastei?' NÃO registram nada: use get_status ou os dados abaixo e responda com contas simples.\n- Se faltar o valor ou ficar ambíguo, pergunte em uma frase. Nunca invente valores.\n- O usuário fala por voz: ignore o 'Tony' chamando você no começo. 'Ganhei 50' sem conta vai pro dinheiro livre. 'Adicionar no Xbox' sem valor: pergunte quanto; com valor, guarde direto na meta.\nFale só de finanças pessoais e do app.\nHoje: "+d.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+".\nContas: "+(S.accounts.map(function(a){return a.name+" R$ "+a.bal}).join("; ")||"nenhuma")+".\nMetas: "+(S.goals.map(function(g){return g.name+": R$ "+g.saved+" de R$ "+g.price+" ("+f1(pc(g))+"%)"}).join("; ")||"nenhuma")+".\n"+bal()+"\nEste mês: entrou R$ "+M.T.in+", gastou R$ "+M.T.out+", foi pra metas R$ "+M.T.dep+".\nÚltimas movimentações: "+rm+".\nO app avisa o usuário quando o dinheiro livre passa de R$ "+(S.nset.free||0)+"; se ele responder a esse aviso, ajude a guardar numa meta.\n\nConversa recente:\n"+hs+"\n\nUsuário: "+x+"\nTony:";
  try{var r=await sm(p,{cache:false,tools:tools(),onText:function(u){el.textContent=u.text;chat.scrollTop=chat.scrollHeight}});
    var t=(r&&r.text||"").trim()||"Feito! ✅";el.textContent=t;S.msgs.push({t:t,me:0});save();AIERR="";aiStat();return true}
  catch(e){el.remove();if(e&&e.code=="not_granted")NOAI=true;AIERR=(e&&e.code)||"erro";aiStat();return false}}
async function send(x){var raw=x.trim();x=raw.replace(/^\s*(?:ei|e a[ií]|fala|opa|oi|ol[aá])?\s*,?\s*tony\b[,:!.\s]*/i,"");if(!raw||busy)return;if(!x){you(raw);say("Fala, tô ouvindo 👂");return}busy=true;you(x);var ok=false;
  if(!S.pending&&!NOAI)try{ok=await ai(x)}catch(e){}
  if(!ok)fb(x);busy=false;render();check()}
$("s").onclick=function(){send($("t").value);$("t").value=""};
$("t").onkeydown=function(e){if(e.key=="Enter"){e.preventDefault();$("s").click()}};
function chatR(){var c=$("chips");c.innerHTML="";
  var l=S.goals.length?["Recebi 100","Gastei 30 no lanche","Guarda 50 na meta","Saldo","Desfaz"]:["Recebi 100","Gastei 30 no lanche","Saldo"];
  if(NOAI||AIERR)l.push("Tentar IA de novo");
  l.forEach(function(x){var b=document.createElement("button");b.textContent=x;b.onclick=function(){if(x=="Tentar IA de novo"){NOAI=false;AIERR="";aiStat();say("Beleza, na próxima mensagem eu tento a IA de novo 😉");render();return}send(x)};c.appendChild(b)});chat.scrollTop=chat.scrollHeight}

S.msgs.forEach(function(m){bubble(m.t,m.me)});
if(!S.msgs.length)say("E aí! Eu sou o Tony 👋 Aqui você me conta o que entrou, o que gastou ou quanto guardou, tipo “recebi 100”, “gastei 30 no lanche” ou “guarda 50 no Xbox”. Eu cuido do resto. Na aba Metas você cria suas metas e vê a previsão de cada uma.");
var REC=null,VD=null,listening=false;
function micState(on){listening=on;$("mic").classList.toggle("on",on)}
async function micInit(){var b=$("mic"),SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  try{VD=await claude.use("dictation")}catch(e){VD=null}
  if(!VD&&!SR)return;b.style.display="block";
  if(VD){VD.onFinal(function(r){if(r&&r.text&&r.text.trim()){send(r.text);VD.stop().catch(function(){})}});VD.onState(function(s){micState(s.state=="listening")})}
  b.onclick=function(){
    if(listening){if(VD)VD.stop().catch(function(){});else if(REC)REC.stop();return}
    if(VD){VD.start().catch(function(){toast("Não consegui usar o microfone aqui")});return}
    try{REC=new SR();REC.lang="pt-BR";REC.interimResults=false;REC.onstart=function(){micState(true)};REC.onend=function(){micState(false)};REC.onerror=function(){toast("Não consegui usar o microfone")};REC.onresult=function(e){var t=e.results[0][0].transcript;if(t)send(t)};REC.start()}catch(e){toast("Microfone indisponível")}}}
aiInit();render();check();micInit();
setInterval(check,60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)check()});
